<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abstract Grader</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&display=swap">
<style>
  /* ── Token system ── */
  :root {
    --bg: #EFECE5;
    --surface: #FAFAF8;
    --surface-alt: #F2EFE8;
    --text: #2C2B28;
    --text-muted: #6B6860;
    --border: #D8D4CB;
    --accent: #3D6B5E;
    --accent-light: #EAF2F0;
    --accent-text: #2A4D44;
    --warn: #8B5E1A;
    --warn-bg: #FDF3E2;
    --done-bg: #E9F2EF;
    --score-unset: #E8E5DE;
    --score-unset-text: #888480;
    --score-active: #3D6B5E;
    --score-active-text: #FFFFFF;
    --star: #C5944A;
    --total-bg: #2C2B28;
    --total-text: #F4F2ED;
    --shadow: rgba(44,43,40,0.08);
    --radius: 8px;
    --sidebar-w: 260px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1A1A18;
      --surface: #232320;
      --surface-alt: #2A2A27;
      --text: #E8E5DF;
      --text-muted: #9A9690;
      --border: #363633;
      --accent: #6A9E91;
      --accent-light: #1D2E2B;
      --accent-text: #A8C8C0;
      --warn: #D4963A;
      --warn-bg: #2A2010;
      --done-bg: #1A2E2A;
      --score-unset: #2E2D2A;
      --score-unset-text: #706E6A;
      --score-active: #6A9E91;
      --score-active-text: #111412;
      --star: #D4963A;
      --total-bg: #E8E5DF;
      --total-text: #1A1A18;
      --shadow: rgba(0,0,0,0.25);
    }
  }

  :root[data-theme="dark"] {
    --bg: #1A1A18;
    --surface: #232320;
    --surface-alt: #2A2A27;
    --text: #E8E5DF;
    --text-muted: #9A9690;
    --border: #363633;
    --accent: #6A9E91;
    --accent-light: #1D2E2B;
    --accent-text: #A8C8C0;
    --warn: #D4963A;
    --warn-bg: #2A2010;
    --done-bg: #1A2E2A;
    --score-unset: #2E2D2A;
    --score-unset-text: #706E6A;
    --score-active: #6A9E91;
    --score-active-text: #111412;
    --star: #D4963A;
    --total-bg: #E8E5DF;
    --total-text: #1A1A18;
    --shadow: rgba(0,0,0,0.25);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    height: 100vh;
    overflow: hidden;
    font-size: 14px;
    line-height: 1.5;
  }

  /* ── Sidebar ── */
  #sidebar {
    width: var(--sidebar-w);
    min-width: var(--sidebar-w);
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #sidebar-header {
    padding: 18px 16px 14px;
    border-bottom: 1px solid var(--border);
  }

  #sidebar-header h1 {
    font-family: 'Libre Baskerville', Georgia, serif;
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.3;
    margin-bottom: 2px;
  }

  #sidebar-header .subtitle {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  #progress-bar-wrap {
    padding: 12px 16px 0;
  }

  #progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  #progress-track {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  #progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.3s ease;
    width: 0%;
  }

  #presenter-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
  }

  .presenter-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    cursor: pointer;
    border-left: 3px solid transparent;
    transition: background 0.15s, border-color 0.15s;
  }

  .presenter-item:hover { background: var(--surface-alt); }

  .presenter-item.active {
    background: var(--accent-light);
    border-left-color: var(--accent);
  }

  .presenter-item.graded .check-dot {
    background: var(--accent);
    color: var(--surface);
  }

  .check-dot {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--score-unset);
    color: var(--score-unset-text);
    font-size: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-weight: 600;
    transition: background 0.2s;
  }

  .presenter-meta {
    flex: 1;
    min-width: 0;
  }

  .presenter-name {
    font-size: 12px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.3;
  }

  .presenter-score-preview {
    font-size: 11px;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }

  .presenter-item .badge {
    font-size: 9px;
    padding: 1px 5px;
    border-radius: 3px;
    font-weight: 600;
    letter-spacing: 0.03em;
    flex-shrink: 0;
  }

  .badge-dup { background: var(--warn-bg); color: var(--warn); }
  .badge-missing { background: var(--score-unset); color: var(--text-muted); }

  #sidebar-actions {
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: var(--radius);
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid transparent;
    transition: opacity 0.15s, background 0.15s;
    text-align: center;
    width: 100%;
  }

  .btn-primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  .btn-primary:hover { opacity: 0.88; }

  .btn-secondary {
    background: transparent;
    color: var(--text);
    border-color: var(--border);
  }

  .btn-secondary:hover { background: var(--surface-alt); }

  .theme-toggle {
    position: absolute;
    top: 14px;
    right: 16px;
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 8px;
    cursor: pointer;
    font-size: 14px;
    color: var(--text-muted);
    transition: background 0.15s;
  }

  .theme-toggle:hover { background: var(--surface-alt); }

  /* ── Main panel ── */
  #main {
    flex: 1;
    overflow-y: auto;
    position: relative;
    padding: 32px 40px 48px;
  }

  #main-inner {
    max-width: 720px;
    margin: 0 auto;
  }

  /* Abstract header */
  .abstract-eyebrow {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 6px;
  }

  .abstract-title {
    font-family: 'Libre Baskerville', Georgia, serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.35;
    text-wrap: balance;
    margin-bottom: 10px;
  }

  .abstract-authors {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 4px;
  }

  .abstract-inst {
    font-size: 12px;
    color: var(--text-muted);
    font-style: italic;
    margin-bottom: 18px;
  }

  .flag-card {
    border-radius: var(--radius);
    padding: 10px 14px;
    font-size: 12px;
    line-height: 1.5;
    margin-bottom: 16px;
    display: flex;
    gap: 8px;
    align-items: flex-start;
  }

  .flag-warn { background: var(--warn-bg); color: var(--warn); }
  .flag-info { background: var(--accent-light); color: var(--accent-text); }

  .flag-icon { font-size: 14px; flex-shrink: 0; margin-top: 1px; }

  .abstract-body {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px 28px;
    font-family: 'Libre Baskerville', Georgia, serif;
    font-size: 15px;
    line-height: 1.85;
    color: var(--text);
    margin-bottom: 28px;
  }

  /* ── Reviewer switcher ── */
  .reviewer-switcher {
    display: flex;
    gap: 6px;
    padding: 12px 16px 10px;
    border-bottom: 1px solid var(--border);
  }

  .reviewer-tab {
    flex: 1;
    padding: 5px 0;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--score-unset);
    color: var(--score-unset-text);
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.03em;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
  }

  .reviewer-tab:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-light);
  }

  .reviewer-tab.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  .reviewer-tab .tab-dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
    margin-right: 4px;
    vertical-align: middle;
    opacity: 0.5;
  }

  .reviewer-tab.done .tab-dot { opacity: 1; }

  /* Reviewer badge in scoring panel */
  .reviewer-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--accent-light);
    color: var(--accent-text);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    margin-bottom: 20px;
  }

  /* Avg display in total bar */
  .total-avg {
    font-size: 11px;
    opacity: 0.6;
    font-weight: 400;
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }

  /* ── Scoring ── */
  .section-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 14px;
  }

  .criteria-grid {
    display: grid;
    gap: 12px;
    margin-bottom: 24px;
  }

  .criterion-row {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .criterion-info {
    flex: 1;
    min-width: 0;
  }

  .criterion-name {
    font-weight: 600;
    font-size: 13px;
    color: var(--text);
    margin-bottom: 2px;
  }

  .criterion-desc {
    font-size: 11px;
    color: var(--text-muted);
    line-height: 1.4;
  }

  .score-pills {
    display: flex;
    gap: 5px;
    flex-shrink: 0;
  }

  .score-pill {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: var(--score-unset);
    color: var(--score-unset-text);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    font-variant-numeric: tabular-nums;
  }

  .score-pill:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-light);
  }

  .score-pill.selected {
    background: var(--score-active);
    color: var(--score-active-text);
    border-color: var(--score-active);
  }

  /* Total bar */
  .total-bar {
    background: var(--total-bg);
    color: var(--total-text);
    border-radius: var(--radius);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 24px;
  }

  .total-label {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    opacity: 0.7;
    flex: 1;
  }

  .total-fraction {
    font-family: 'Libre Baskerville', Georgia, serif;
    font-size: 28px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }

  .total-stars {
    font-size: 16px;
    letter-spacing: 2px;
    color: var(--star);
    min-width: 90px;
    text-align: right;
  }

  /* Type toggle */
  .type-toggle-row {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
    align-items: center;
    flex-wrap: wrap;
  }

  .type-toggle-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 600;
    color: var(--text-muted);
    margin-right: 4px;
  }

  .type-pill {
    padding: 6px 16px;
    border-radius: 20px;
    border: 2px solid var(--border);
    background: var(--score-unset);
    color: var(--score-unset-text);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    font-family: 'Inter', sans-serif;
  }

  .type-pill:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-light);
  }

  .type-pill.selected {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  /* Location */
  .location-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 24px;
  }

  .location-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 600;
    color: var(--text-muted);
    white-space: nowrap;
  }

  input.location-field {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 8px 12px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }

  input.location-field:focus { border-color: var(--accent); }
  input.location-field::placeholder { color: var(--text-muted); }

  /* Notes */
  .notes-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 8px;
    display: block;
  }

  textarea.notes-field {
    width: 100%;
    min-height: 110px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    color: var(--text);
    resize: vertical;
    outline: none;
    transition: border-color 0.15s;
    line-height: 1.6;
    margin-bottom: 28px;
  }

  textarea.notes-field:focus { border-color: var(--accent); }
  textarea.notes-field::placeholder { color: var(--text-muted); }

  /* Nav buttons */
  .nav-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
  }

  .nav-row .btn { width: auto; flex: 1; }

  /* Placeholder screen */
  .placeholder-screen {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
  }

  .placeholder-screen .ph-icon { font-size: 48px; margin-bottom: 16px; }
  .placeholder-screen h3 {
    font-family: 'Libre Baskerville', Georgia, serif;
    font-size: 20px;
    color: var(--text);
    margin-bottom: 8px;
  }
  .placeholder-screen p { font-size: 13px; line-height: 1.7; max-width: 360px; margin: 0 auto; }

  /* Export area */
  #csv-fallback-area {
    display: none;
    margin-top: 12px;
  }

  #csv-fallback-area textarea {
    width: 100%;
    height: 120px;
    font-size: 11px;
    font-family: monospace;
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px;
    color: var(--text);
    resize: none;
  }

  #csv-fallback-area .help-text {
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  /* Summary view */
  #summary-view { display: none; }

  #summary-view table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }

  #summary-view th {
    background: var(--surface-alt);
    font-weight: 600;
    text-align: left;
    padding: 8px 10px;
    border-bottom: 2px solid var(--border);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-muted);
  }

  #summary-view td {
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }

  #summary-view tr:hover td { background: var(--surface-alt); }

  .summary-score { font-weight: 600; color: var(--accent); }

  #grade-view { display: block; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<nav id="sidebar">
  <div id="sidebar-header">
    <h1>Abstract Grader</h1>
    <div class="subtitle">CED Symposium · 2026</div>
  </div>
  <div class="reviewer-switcher" id="reviewer-switcher"></div>
  <div id="progress-bar-wrap">
    <div id="progress-label">
      <span id="progress-text">0 of 30 graded</span>
      <span id="progress-pct">0%</span>
    </div>
    <div id="progress-track"><div id="progress-fill"></div></div>
  </div>
  <div id="presenter-list"></div>
  <div id="sidebar-actions">
    <button class="btn btn-secondary" onclick="toggleSummary()">📋 View Summary</button>
    <button class="btn btn-primary" onclick="exportCSV()">⬇ Export CSV</button>
    <div id="csv-fallback-area">
      <p class="help-text">Copy the text below and paste into a .csv file:</p>
      <textarea id="csv-text" readonly></textarea>
    </div>
  </div>
</nav>

<button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">☀︎</button>

<main id="main">
  <div id="main-inner">
    <div id="grade-view">
      <div id="abstract-panel"></div>
    </div>
    <div id="summary-view">
      <div class="abstract-eyebrow">All Submissions</div>
      <div class="abstract-title" style="font-size:20px; margin-bottom:20px;">Grading Summary</div>
      <div style="overflow-x:auto;">
        <table id="summary-table">
          <thead>
            <tr>
              <th rowspan="2">#</th>
              <th rowspan="2">Presenter</th>
              <th rowspan="2">Format</th>
              <th rowspan="2">Location</th>
              <th colspan="5" style="text-align:center;border-bottom:1px solid var(--border)">Reviewer 1</th>
              <th colspan="5" style="text-align:center;border-bottom:1px solid var(--border)">Reviewer 2</th>
              <th colspan="5" style="text-align:center;border-bottom:1px solid var(--border)">Reviewer 3</th>
              <th colspan="2" style="text-align:center;border-bottom:1px solid var(--border)">Average</th>
            </tr>
            <tr>
              <th>CE</th><th>DES</th><th>IMP</th><th>TQ</th><th>Tot</th>
              <th>CE</th><th>DES</th><th>IMP</th><th>TQ</th><th>Tot</th>
              <th>CE</th><th>DES</th><th>IMP</th><th>TQ</th><th>Tot</th>
              <th>Avg</th><th>Notes</th>
            </tr>
          </thead>
          <tbody id="summary-tbody"></tbody>
        </table>
      </div>
      <div style="margin-top:20px;">
        <button class="btn btn-secondary" style="width:auto; padding:8px 16px;" onclick="toggleSummary()">← Back to Grading</button>
      </div>
    </div>
  </div>
</main>

<script>
// ── Data ──────────────────────────────────────────────────────────────────────
const CRITERIA = [
  { id: 'ce',  name: 'Community Engagement', desc: 'Depth of community involvement, partnership quality, reciprocity' },
  { id: 'des', name: 'Design',               desc: 'Quality of design thinking, methodology, and creative approach' },
  { id: 'imp', name: 'Impact / Implications', desc: 'Significance of outcomes, broader implications for the field' },
  { id: 'tq',  name: 'Topic Quality',         desc: 'Relevance, clarity, originality, and scholarly contribution' },
];

const submissions = [
  {
    id: 1,
    presenter: 'Dee Dee DeVuyst',
    institution: 'Radian',
    title: 'From Community Vision to Public Infrastructure: Power, Authorship, and Reciprocity in the 303 ArtWay',
    abstract: 'This paper explores the 303 ArtWay project — a 3.2-mile urban trail connecting three under-resourced communities in Lakewood, Colorado. The presenter examines how a community-driven vision was translated into public infrastructure, grappling with questions of authorship, power, and reciprocity throughout a multi-year community engagement and design process. The project reflects on challenges of working across institutional and community boundaries, centering community expertise, and maintaining authentic partnership when professional design practice intersects with grassroots organizing.',
    flags: [],
    scores: { ce: 0, des: 0, imp: 0, tq: 0 },
    notes: ''
  },
  {
    id: 2,

// ── State ────────────────────────────────────────────────────────────────────
let current = 0;
let showingSummary = false;
let theme = 'system';
let currentGrader = 0;

const REVIEWER_NAMES = ['Reviewer 1', 'Reviewer 2', 'Reviewer 3'];

// ── Render helpers ────────────────────────────────────────────────────────────
function graderData(sub, g) {
  return sub.graders[g];
}

function isGraded(sub, g) {
  const gi = g !== undefined ? g : currentGrader;
  const s = sub.graders[gi].scores;
  return s.ce > 0 && s.des > 0 && s.imp > 0 && s.tq > 0;
}

function totalScore(sub, g) {
  const gi = g !== undefined ? g : currentGrader;
  const s = sub.graders[gi].scores;
  return s.ce + s.des + s.imp + s.tq;
}

function avgTotal(sub) {
  let count = 0; let sum = 0;
  for (let g = 0; g < 3; g++) {
    if (isGraded(sub, g)) { sum += totalScore(sub, g); count++; }
  }
  return count > 0 ? (sum / count).toFixed(1) : null;
}

function allNotes(sub) {
  return sub.graders.map((g, i) => g.notes ? `R${i+1}: ${g.notes}` : '').filter(Boolean).join(' | ');
}

function stars(score, max = 20) {
  if (score === 0) return '';
  const pct = score / max;
  if (pct >= 0.9) return '★★★★★';
  if (pct >= 0.75) return '★★★★☆';
  if (pct >= 0.6) return '★★★☆☆';
  if (pct >= 0.4) return '★★☆☆☆';
  return '★☆☆☆☆';
}

      onclick="switchGrader(${g})">
      <span class="tab-dot"></span>${name.replace('Reviewer ', 'R')}
    </button>`;
  }).join('');

    const g = isGraded(sub);
    const tot = totalScore(sub);
    const avg = avgTotal(sub);
    const activeClass = i === current && !showingSummary ? ' active' : '';
    const gradedClass = g ? ' graded' : '';
    let badge = '';
    if (sub.missing) badge = '<span class="badge badge-missing">?</span>';
    else if (sub.flags.some(f => f.includes('twice'))) badge = '<span class="badge badge-dup">DUP</span>';

    let preview;
    if (sub.missing) preview = 'No file';
    else if (g) preview = `${tot}/20${avg ? ` · avg ${avg}` : ''}`;
    else preview = 'Not graded';

    return `<div class="presenter-item${activeClass}${gradedClass}" onclick="selectSubmission(${i})">
      <div class="check-dot">${g ? '✓' : ''}</div>
      <div class="presenter-meta">
        <div class="presenter-name">${sub.presenter}</div>
        <div class="presenter-score-preview">${preview}</div>
      </div>
      ${badge}
    </div>`;
  }).join('');
}

function renderMain() {
  if (showingSummary) return;
  const sub = submissions[current];
  const panel = document.getElementById('abstract-panel');

  let flagsHtml = sub.flags.map(f => {
    const isWarn = f.startsWith('⚠');
    return `<div class="flag-card ${isWarn ? 'flag-warn' : 'flag-info'}">
      <span class="flag-icon">${isWarn ? '⚠' : 'ℹ'}</span>
      <span>${f.replace(/^[⚠ℹ]\s?/, '')}</span>
    </div>`;
  }).join('');

  let abstractSection = '';
  if (sub.missing) {
    abstractSection = `<div class="placeholder-screen">
      <div class="ph-icon">📄</div>
      <h3>File Not Available</h3>
      <p>The PDF for this submission was not included in the uploaded files. Please review the original submission separately and record your scores below.</p>
    </div>`;
  } else {
    abstractSection = `<div class="abstract-body">${sub.abstract}</div>`;
  }

  const gd = sub.graders[currentGrader];
  const tot = totalScore(sub);
  const allSet = isGraded(sub);
  const avg = avgTotal(sub);
  const prevDisabled = current === 0 ? 'style="opacity:0.4;pointer-events:none"' : '';
  const nextDisabled = current === submissions.length - 1 ? 'style="opacity:0.4;pointer-events:none"' : '';

  panel.innerHTML = `
    <div class="abstract-eyebrow">Submission ${sub.id} of ${submissions.length}</div>
    <div class="abstract-title">${sub.title}</div>
    <div class="abstract-authors">${sub.presenter}</div>
    <div class="abstract-inst">${sub.institution}</div>
    ${flagsHtml}
    ${abstractSection}

    <div class="type-toggle-row">
      <span class="type-toggle-label">Format</span>
      <button class="type-pill ${sub.type === 'case' ? 'selected' : ''}"
              onclick="setType(${current}, 'case')">Case Study</button>
      <button class="type-pill ${sub.type === 'deepdive' ? 'selected' : ''}"
              onclick="setType(${current}, 'deepdive')">Deep Dive</button>
    </div>

    <div class="location-row">
      <span class="location-label">📍 Location</span>
      <input class="location-field" type="text"
             placeholder="City, Country"
             value="${sub.location || ''}"
             oninput="setLocation(${current}, this.value)">
    </div>

    <div class="reviewer-badge">
      ✎ ${REVIEWER_NAMES[currentGrader]}
    </div>

    <div class="section-label">Scoring Criteria</div>
    <div class="criteria-grid">
      ${CRITERIA.map(c => `
        <div class="criterion-row">
          <div class="criterion-info">
            <div class="criterion-name">${c.name}</div>
            <div class="criterion-desc">${c.desc}</div>
          </div>
          <div class="score-pills" id="pills-${c.id}">
            ${[1,2,3,4,5].map(n => `
              <button class="score-pill ${gd.scores[c.id] === n ? 'selected' : ''}"
                      onclick="setScore(${current}, '${c.id}', ${n})"
                      aria-label="Score ${n} for ${c.name}">
                ${n}
              </button>`).join('')}
          </div>
        </div>`).join('')}
    </div>

    <div class="total-bar">
      <div class="total-label">
        Total Score
        ${avg ? `<div class="total-avg">avg all reviewers: ${avg}/20</div>` : ''}
      </div>
      <div class="total-stars" id="stars-display">${allSet ? stars(tot) : ''}</div>
      <div class="total-fraction" id="total-display">${allSet ? tot : '—'}<span style="font-size:16px;opacity:0.5"> /20</span></div>
    </div>

    <label class="notes-label" for="notes-field">Notes — ${REVIEWER_NAMES[currentGrader]}</label>
    <textarea class="notes-field" id="notes-field"
              placeholder="Overall impressions, strengths, concerns, recommendations…"
              oninput="setNotes(${current}, this.value)">${gd.notes}</textarea>

    <div class="nav-row">
      <button class="btn btn-secondary" ${prevDisabled} onclick="navigate(-1)">← Previous</button>
      <button class="btn btn-primary" ${nextDisabled} onclick="navigate(1)">Next →</button>
    </div>
  `;
}

function renderSummaryTable() {
  const tbody = document.getElementById('summary-tbody');
  tbody.innerHTML = submissions.map((sub, i) => {
    const graderCells = sub.graders.map((gd, g) => {
      const s = gd.scores;
      const graded = isGraded(sub, g);
      const tot = graded ? totalScore(sub, g) : '–';
      return `<td class="summary-score">${s.ce || '–'}</td>
              <td class="summary-score">${s.des || '–'}</td>
              <td class="summary-score">${s.imp || '–'}</td>
              <td class="summary-score">${s.tq || '–'}</td>
              <td style="font-weight:700;color:var(--accent)">${tot}</td>`;
    }).join('');
    const avg = avgTotal(sub);
    const notes = allNotes(sub);
    return `<tr>
      <td>${sub.id}</td>
      <td>
        <div style="font-weight:500">${sub.presenter}</div>
        <div style="color:var(--text-muted);font-size:11px">${sub.institution}</div>
      </td>
      <td style="font-size:11px;white-space:nowrap">${sub.type === 'case' ? '📋 Case' : sub.type === 'deepdive' ? '🔍 Deep Dive' : '–'}</td>
      <td style="font-size:11px;color:var(--text-muted)">${sub.location || '–'}</td>
      ${graderCells}
      <td style="font-weight:700;color:var(--accent)">${avg ? avg : '–'}</td>
      <td style="color:var(--text-muted);font-size:11px;max-width:180px">${notes ? notes.substring(0, 100) + (notes.length > 100 ? '…' : '') : ''}</td>
    </tr>`;
  }).join('');
}

// ── Actions ───────────────────────────────────────────────────────────────────
function selectSubmission(i) {
  if (showingSummary) toggleSummary();
  current = i;
  renderSidebar();
  renderMain();
  document.getElementById('main').scrollTop = 0;
}

function switchGrader(g) {
  currentGrader = g;
  renderSidebar();
  renderMain();
}

function setScore(idx, criterion, value) {
  submissions[idx].graders[currentGrader].scores[criterion] = value;
  renderSidebar();
  renderMain();
}

function setNotes(idx, value) {
  submissions[idx].graders[currentGrader].notes = value;
}

function setType(idx, value) {
  submissions[idx].type = submissions[idx].type === value ? '' : value;
  renderMain();
}

function setLocation(idx, value) {
  submissions[idx].location = value;
}

function navigate(dir) {
  const next = current + dir;
  if (next >= 0 && next < submissions.length) {
    selectSubmission(next);
  }
}

function toggleSummary() {
  showingSummary = !showingSummary;
  document.getElementById('grade-view').style.display = showingSummary ? 'none' : 'block';
  document.getElementById('summary-view').style.display = showingSummary ? 'block' : 'none';
  if (showingSummary) renderSummaryTable();
  renderSidebar();
}

function exportCSV() {
  const gCols = ['CE','DES','IMP','TQ','Total'];
  const headers = [
    '#','Presenter','Institution','Title','Format','Location',
    ...gCols.map(c => `R1_${c}`),
    ...gCols.map(c => `R2_${c}`),
    ...gCols.map(c => `R3_${c}`),
    'Avg_Total',
    'R1_Notes','R2_Notes','R3_Notes'
  ];
  const rows = submissions.map(sub => {
    const typeLabel = sub.type === 'case' ? 'Case Study' : sub.type === 'deepdive' ? 'Deep Dive' : '';
    const perGrader = sub.graders.map((gd, g) => {
      const s = gd.scores;
      const tot = isGraded(sub, g) ? totalScore(sub, g) : '';
      return [s.ce||'', s.des||'', s.imp||'', s.tq||'', tot];
    }).flat();
    const avg = avgTotal(sub) || '';
    return [
      sub.id,
      sub.presenter,
      sub.institution,
      sub.title,
      typeLabel,
      sub.location || '',
      ...perGrader,
      avg,
      sub.graders[0].notes,
      sub.graders[1].notes,
      sub.graders[2].notes,
    ].map(v => `"${String(v).replace(/"/g, '""')}"`).join(',');
  });

  const csv = [headers.join(','), ...rows].join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'abstract_grades_CED2026.csv';
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 5000);

  // Fallback textarea
  const fa = document.getElementById('csv-fallback-area');
  document.getElementById('csv-text').value = csv;
  fa.style.display = 'block';
}

function toggleTheme() {
  const root = document.documentElement;
  if (theme === 'system' || theme === 'light') {
    root.setAttribute('data-theme', 'dark');
    theme = 'dark';
    document.querySelector('.theme-toggle').textContent = '☾';
  } else {
    root.setAttribute('data-theme', 'light');
    theme = 'light';
    document.querySelector('.theme-toggle').textContent = '☀︎';
  }
}

// ── Init ──────────────────────────────────────────────────────────────────────
const EMPTY_GRADER = () => ({ scores: { ce: 0, des: 0, imp: 0, tq: 0 }, notes: '' });

submissions.forEach(s => {
  if (!('type' in s)) s.type = '';
  if (!('location' in s)) s.location = '';
  if (!('graders' in s)) s.graders = [EMPTY_GRADER(), EMPTY_GRADER(), EMPTY_GRADER()];
  // Migrate legacy single-grader data if present
  if ('scores' in s && s.graders[0].scores.ce === 0) {
    s.graders[0].scores = { ...s.scores };
    if ('notes' in s) s.graders[0].notes = s.notes || '';
  }
  delete s.scores;
  delete s.notes;
});
renderSidebar();
renderMain();
</script>
</body>
