956489988, 30.386247155558106], [-93.5192809191104, 29.92943828507267], [-93.26911069036595, 29.47215274298766], [-93.0211882343118, 29.014403528945266], [-92.77545435059089, 28.556203305695316], [-92.53185123496341, 28.097564411341043], [-92.29032243294866, 27.63849887112311], [-92.05081279493902, 27.179018408762126], [-91.81326843273601, 26.71913445737877], [-91.57763667745948, 26.258858170010004], [-91.3438660387831, 25.798200429738785], [-91.11190616544948, 25.337171859454195], [-90.88170780702, 24.875782831257975], [-90.65322277681547, 24.414043475532793], [-90.42640391600524, 23.95196368968704], [-90.201205058803, 23.489553146590023], [-89.97758099872924, 23.0268213027111], [-89.75548745590146, 22.56377740597562], [-89.53488104531384, 22.100430503349873], [-89.31571924607009, 21.636789448166883], [-89.0979603715335, 21.17286290720427], [-88.88156354035986, 20.708659367525026], [-88.66648864837971, 20.244187143091427], [-88.45269634129734, 19.77945438116206], [-88.24014798817555, 19.314469068481465], [-88.02880565567526, 18.849239037271335], [-87.81863208302073, 18.38377197103215], [-87.60959065766193, 17.91807541016347], [-87.40164539160622, 17.452156757410986], [-87.19476089839263, 16.986023283147944], [-86.98890237068285, 16.51968213049841], [-86.78403555844379, 16.053140320309307], [-86.58012674769729, 15.586404755978274], [-86.3771427398135, 15.119482228143653], [-86.17505083132482, 14.652379419243028], [-85.9738187942387, 14.185102907946355], [-85.7734148568271, 13.717659173469496], [-85.57380768487252, 13.250054599773792], [-85.3749663633497, 12.78229547965702], [-85.17686037852363, 12.314388018741074], [-84.97945960044487, 11.846338339361267], [-84.78273426582336, 11.378152484362229], [-84.58665496126291, 10.909836420805018], [-84.39119260683854, 10.44139604359001], [-84.19631844, 9.972837179]]}, "properties": {"OID": 102, "country": "costarica", "origin": null, "flow_status": "illicit", "flow_type": "weapons", "flow_specific": "small arms", "flows_simultaneous": "no", "transportation_mode": null, "means_of_transport": null, "FROM_location": "United States", "TO_location": "Costa Rica"}}]};

    // Custom legend order / colors — kept consistent with the rest of the series
    const ORDER = ["drugs", "weapons", "people", "other"];
    const COLOR_BY_TYPE = {
      "drugs": "#ff0000",    // red
      "weapons": "#ff8800",  // orange
      "people": "#ffff00",   // yellow
      "other": "#cccccc"     // grey
    };

    let activeTypes = new Set();
    let colorMap = {};
    let allTypes = [];

    function buildLineColorExpression() {
      const expr = ["match", ["get", "flow_type"]];
      allTypes.forEach(t => expr.push(t, colorMap[t]));
      expr.push("#ffffff");
      return expr;
    }

    function buildLineFilter() {
      if (activeTypes.size === 0) return ["==", "1", "0"];
      if (activeTypes.size === allTypes.length) return null;
      return ["in", ["get", "flow_type"], ["literal", [...activeTypes]]];
    }

    function applyFilter() {
      const lf = buildLineFilter();
      if (map.getLayer("animated-line")) map.setFilter("animated-line", lf);
    }

    function buildLegend() {
      const legend = document.getElementById("legend");
      legend.querySelectorAll(".legend-item, .shape-item, .legend-divider, .section-label").forEach(el => el.remove());

      allTypes.forEach(type => {
        const item = document.createElement("div");
        item.className = "legend-item";
        item.dataset.type = type;

        item.innerHTML = `
          <div class="swatch" style="background:${colorMap[type]};"></div>
          <span>${type.charAt(0).toUpperCase() + type.slice(1)}</span>
        `;

        item.addEventListener("click", () => {
          if (activeTypes.has(type)) {
            activeTypes.delete(type);
            item.classList.add("off");
          } else {
            activeTypes.add(type);
            item.classList.remove("off");
          }
          applyFilter();
        });

        legend.appendChild(item);
      });
    }

    map.on("load", () => {

      // Solid navy sky, no stars, no haze
      map.setFog({
        color: "#002147",
        "horizon-blend": 0.0,
        "star-intensity": 0.0,
        range: [-1, 2]
      });

      // Background color matches sky
      if (map.getLayer("background")) {
        map.setPaintProperty("background", "background-color", "#002147");
        map.setPaintProperty("background", "background-emissive-strength", 1);
      }

      map.addSource("countries", {
        type: "vector",
        url: "mapbox://mapbox.country-boundaries-v1"
      });

      map.addLayer({
        id: "costa-rica-outline",
        type: "line",
        source: "countries",
        "source-layer": "country_boundaries",
        paint: {
          "line-color": "#FFFFFF",
          "line-width": 3,
          "line-emissive-strength": 0.8
        },
        filter: ["==", ["get", "iso_3166_1_alpha_3"], "CRI"]
      });

      // ---- Gather flow types from the connections dataset for the legend/colors ----
      const typesSet = new Set();
      LINES_GEOJSON_DATA.features.forEach(f => {
        const t = f.properties && f.properties.flow_type;
        if (t) typesSet.add(t.toLowerCase());
      });

      allTypes = [...typesSet].sort((a, b) => ORDER.indexOf(a) - ORDER.indexOf(b));

      allTypes.forEach(t => {
        colorMap[t] = COLOR_BY_TYPE[t] || "#ffffff";
        activeTypes.add(t);
      });

      // ---- Animated connection lines (origin -> destination arcs) ----
      map.addSource("connections", {
        type: "geojson",
        data: LINES_GEOJSON_DATA
      });

      map.addLayer({
        id: "animated-line",
        type: "line",
        source: "connections",
        paint: {
          "line-width": 1.2,
          "line-dasharray": [0, 1, 0.5],
          "line-color": buildLineColorExpression(),
          "line-opacity": 1,
          "line-emissive-strength": 1
        }
      });

      buildLegend();
      applyFilter();

      // ---- Tooltips ----
      const tooltip = document.getElementById("tooltip");

      map.on("mousemove", "animated-line", (e) => {
        if (!e.features.length) return;
        const p = e.features[0].properties;
        tooltip.style.display = "block";
        tooltip.style.left = (e.point.x + 12) + "px";
        tooltip.style.top = (e.point.y + 12) + "px";

        const flowType = p.flow_type ? `<div class="row"><span class="label">Illicit flow type:</span> ${p.flow_type.charAt(0).toUpperCase() + p.flow_type.slice(1)}</div>` : "";
        const flowDesc = p.flow_specific ? `<div class="row"><span class="label">Illicit flow description:</span> ${p.flow_specific}</div>` : "";
        const mode = p.transportation_mode ? `<div class="row"><span class="label">Mode of transport:</span> ${p.transportation_mode}</div>` : "";
        const means = p.means_of_transport ? `<div class="row"><span class="label">Means of transport:</span> ${p.means_of_transport}</div>` : "";

        tooltip.innerHTML =
          `<b>${p.FROM_location || "?"} &rarr; ${p.TO_location || "?"}</b>` +
          flowType + flowDesc + mode + means;
      });
      map.on("mouseleave", "animated-line", () => {
        tooltip.style.display = "none";
      });

      // ---- Animated dash for the connection lines ----
      const dashArraySequence = [
        [0,4,3],[0.5,4,2.5],[1,4,2],[1.5,4,1.5],[2,4,1],[2.5,4,0.5],[3,4,0],
        [0,0.5,3,3.5],[0,1,3,3],[0,1.5,3,2.5],[0,2,3,2],[0,2.5,3,1.5],[0,3,3,1],[0,3.5,3,0.5]
      ];

      let step = 0;
      function animateDashArray(timestamp) {
        const newStep = Math.floor((timestamp / 50) % dashArraySequence.length);
        if (newStep !== step) {
          if (map.getLayer("animated-line")) {
            map.setPaintProperty("animated-line", "line-dasharray", dashArraySequence[newStep]);
          }
          step = newStep;
        }
        requestAnimationFrame(animateDashArray);
      }

      animateDashArray(0);
    });
  </script>
