<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chord Diagram</title>

<!-- amCharts 5 -->
<script src="https://cdn.amcharts.com/lib/5/index.js"></script>
<script src="https://cdn.amcharts.com/lib/5/flow.js"></script>
<script src="https://cdn.amcharts.com/lib/5/themes/Animated.js"></script>

<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji",
      "Segoe UI Symbol";
  }

  #chartdiv {
    width: 100%;
    height: 900px;
  }
</style>
</head>

<body>

<div id="chartdiv"></div>

<script>
// ---------------------------------------
// amCharts 5 Chord Diagram
// ---------------------------------------

// Create root element
var root = am5.Root.new("chartdiv");

// Set theme
root.setThemes([
  am5themes_Animated.new(root)
]);

// Create series
var series = root.container.children.push(
  am5flow.ChordDirected.new(root, {
    startAngle: 80,
    padAngle: 1,
    linkHeadRadius: undefined,
    sourceIdField: "from",
    targetIdField: "to",
    valueField: "value"
  })
);

// Label styling
series.nodes.labels.template.setAll({
  textType: "radial",
  centerX: 0,
  fontSize: 9
});

// Link color = source node color
series.links.template.set("fillStyle", "source");

// DATA (converted to JSON)
series.data.setAll([
  { "from": "Gov. of Nigeria", "to": "Jama'atu Ahlis Sunna Lidda'awati wal-Jihad", "value": 30 },
  { "from": "Gov. of Nigeria", "to": "IS", "value": 25 },
  { "from": "Gov. of Cameroon", "to": "IS", "value": 2 },
  { "from": "Gov. of Cameroon", "to": "Jama'atu Ahlis Sunna Lidda'awati wal-Jihad", "value": 1 },
  { "from": "Gov. of Chad", "to": "IS", "value": 1 },
  { "from": "Jama'atu Ahlis Sunna Lidda'awati wal-Jihad", "to": "Yan Gora", "value": 2 },
  { "from": "Yan Gora", "to": "IS", "value": 1 },
  { "from": "Gov.of Niger", "to": "IS", "value": 2 }
]);

// Animate on load
series.appear(1000, 100);

</script>

</body>
</html>
